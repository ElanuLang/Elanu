name: Attach designation role to state cells

on:
  push:
    branches:
      - attach-designation-role-to-state-cells

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: attach-designation-role-to-state-cells
      - name: Apply bounded runtime representation change
        run: |
          python .github/scripts/attach_designation_role_to_state_cells.py
          python .github/scripts/fix_state_cell_test_helpers.py
      - name: Format and validate focused runtime behavior
        run: |
          cd compiler
          cargo fmt
          cargo test runtime::designation_metadata_execution -- --nocapture
          cargo test runtime::model_local_designation_experiment -- --nocapture
          cargo test runtime::lifetime_termination_execution -- --nocapture
          cd ..
      - name: Commit bounded representation change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime.rs compiler/src/runtime/model_local_designation_experiment.rs compiler/src/runtime/structural_move_execution.rs compiler/src/runtime/relative_navigation_execution.rs
          git commit -m "Attach designation role to runtime state cells"
          git push origin HEAD:attach-designation-role-to-state-cells
