name: Promote explicit subtree purge

on:
  push:
    branches:
      - promote-explicit-subtree-purge

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote-explicit-subtree-purge
      - name: Apply bounded purge promotion
        run: |
          python .github/scripts/fix_explicit_purge_promotion_script.py
          python .github/scripts/promote_explicit_subtree_purge.py
          python .github/scripts/fix_purge_static_owner_lowering.py
      - name: Format and run focused lifetime tests
        run: |
          cd compiler
          cargo fmt
          cargo test runtime::lifetime_termination_execution -- --nocapture
          cd ..
      - name: Commit production promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/lifetime_termination_surface.rs compiler/src/live_designation_lowering.rs compiler/src/runtime.rs compiler/src/runtime/lifetime_termination_execution.rs docs/LANGUAGE_REFERENCE.md docs/DESIGN_DECISIONS.md CHANGELOG.md
          git commit -m "Add explicit lifetime subtree purge"
          git push origin HEAD:promote-explicit-subtree-purge
