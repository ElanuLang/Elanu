name: Apply dynamic-owner structural edit

on:
  push:
    branches:
      - dynamic-owner-structural-edit

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamic-owner-structural-edit
      - name: Apply bounded composition change
        run: |
          python .github/scripts/apply_dynamic_owner_structural_edit.py
          python .github/scripts/fix_dynamic_owner_structural_remove_runtime.py
      - name: Format and run focused tests
        run: |
          cd compiler
          cargo fmt
          cargo test dynamic_owner_structural_edit_tests -- --nocapture
          cd ..
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/lib.rs compiler/src/existing_designation_insert_surface.rs compiler/src/structural_edit_surface.rs compiler/src/runtime_index_grant_transport.rs compiler/src/runtime.rs compiler/src/dynamic_owner_structural_edit_tests.rs docs/LANGUAGE_REFERENCE.md docs/DESIGN_DECISIONS.md CHANGELOG.md
          git commit -m "Compose structural edits through dynamic owners"
          git push origin HEAD:dynamic-owner-structural-edit
