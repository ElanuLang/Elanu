name: Fix provenance visibility

on:
  push:
    branches:
      - preserve-model-sequence-provenance

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preserve-model-sequence-provenance
      - name: Fix transport visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('compiler/src/model_sequence_integration.rs')
          text = path.read_text()
          text = text.replace('pub(crate) struct ExternalizedModelSequence {', 'pub struct ExternalizedModelSequence {', 1)
          text = text.replace('pub(crate) struct ModelSequenceLowering {', 'pub struct ModelSequenceLowering {', 1)
          path.write_text(text)
          PY
          cd compiler
          cargo fmt
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/model_sequence_integration.rs
          git commit -m "Expose lowering transport types consistently"
          git push origin HEAD:preserve-model-sequence-provenance
