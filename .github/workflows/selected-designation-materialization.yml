name: Selected designation materialization

on:
  push:
    branches:
      - selected-identity-materialization-pressure

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: selected-identity-materialization-pressure
      - name: Wire selected designation materialization
        run: |
          python .github/scripts/wire_selected_designation_materialization.py
          python .github/scripts/fix_selected_designation_format.py
          python .github/scripts/stabilize_selected_designation_format.py
      - name: Validate compiler
        working-directory: compiler
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test runtime::persistence::partial::tests
          cargo test
          cargo build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/designation_runtime_metadata.rs compiler/src/lib.rs compiler/src/runtime/persistence/partial.rs docs/DEVELOPMENT.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Preserve selected designation materialization binding"
            git push origin HEAD:selected-identity-materialization-pressure
          fi
