name: Partial materialization experiment

on:
  push:
    branches:
      - partial-materialization-representation-experiment

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partial-materialization-representation-experiment
      - run: python .github/scripts/add_partial_materialization_experiment.py
      - name: Validate partial materialization experiment
        run: |
          cd compiler
          cargo fmt
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test runtime::persistence::partial_materialization_experiment:: -- --nocapture
          cargo build
          cd ..
      - name: Commit experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime/persistence.rs compiler/src/runtime/persistence/partial_materialization_experiment.rs
          git commit -m "Expose partial materialization representation gap"
          git push origin HEAD:partial-materialization-representation-experiment
