name: Patch dynamic model type fixtures

on:
  push:
    branches:
      - preserve-dynamic-model-type

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preserve-dynamic-model-type
      - run: python .github/scripts/patch_dynamic_model_type_fixtures.py
      - run: |
          cd compiler
          cargo fmt
          cargo test
          cd ..
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime/structural_move_execution.rs compiler/src/runtime/relative_navigation_execution.rs
          git commit -m "Update Runtime test fixtures"
          git push origin HEAD:preserve-dynamic-model-type
