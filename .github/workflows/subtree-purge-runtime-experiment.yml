name: Subtree purge runtime experiment

on:
  push:
    branches:
      - subtree-purge-runtime-experiment

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subtree-purge-runtime-experiment
      - name: Apply runtime-only experiment
        run: python .github/scripts/apply_subtree_purge_experiment.py
      - name: Format and run focused termination tests
        run: |
          cd compiler
          cargo fmt
          cargo test runtime::lifetime_termination_execution -- --nocapture
          cd ..
      - name: Commit runtime experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime.rs compiler/src/runtime/lifetime_termination_execution.rs
          git commit -m "Pressure-test provenance subtree purge"
          git push origin HEAD:subtree-purge-runtime-experiment
