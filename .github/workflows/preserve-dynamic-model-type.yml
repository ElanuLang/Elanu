name: Preserve dynamic model type

on:
  push:
    branches:
      - preserve-dynamic-model-type

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preserve-dynamic-model-type
      - name: Apply bounded runtime metadata patch
        run: python .github/scripts/preserve_dynamic_model_type.py
      - name: Format and run focused tests
        run: |
          cd compiler
          cargo fmt
          cargo test runtime::persistence_identity_metadata -- --nocapture
          cargo test runtime::provenance_transfer_execution -- --nocapture
          cargo test runtime::lifetime_termination_execution -- --nocapture
          cd ..
      - name: Commit structured metadata preservation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime.rs compiler/src/runtime/persistence_identity_metadata.rs
          git commit -m "Preserve dynamic identity model type"
          git push origin HEAD:preserve-dynamic-model-type
