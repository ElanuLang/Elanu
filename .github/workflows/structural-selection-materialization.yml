name: Structural selection materialization

on:
  push:
    branches:
      - structural-selection-materialization-pressure

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structural-selection-materialization-pressure
      - name: Wire structural selection materialization
        run: python .github/scripts/wire_structural_selection_materialization.py
      - name: Validate compiler
        working-directory: compiler
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test runtime::persistence::partial::tests
          cargo test
          cargo build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime/persistence/partial.rs docs/DEVELOPMENT.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Materialize partial backing through structural selection"
            git push origin HEAD:structural-selection-materialization-pressure
          fi
