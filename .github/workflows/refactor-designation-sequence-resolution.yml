name: Refactor designation sequence resolution

on:
  push:
    branches:
      - refactor-designation-sequence-resolution

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-designation-sequence-resolution
      - name: Apply bounded refactor
        run: python .github/scripts/refactor_designation_sequence_resolution.py
      - name: Format and commit
        run: |
          cd compiler
          cargo fmt
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/sequence_lowering.rs
          git commit -m "Separate designation sequence resolution from expression materialization"
          git push origin HEAD:refactor-designation-sequence-resolution
