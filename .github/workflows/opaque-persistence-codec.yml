name: Opaque persistence codec

on:
  push:
    branches:
      - opaque-persistence-codec

permissions:
  contents: write

jobs:
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opaque-persistence-codec
      - run: python .github/scripts/add_opaque_persistence_codec.py
      - name: Validate opaque persistence codec
        run: |
          cd compiler
          cargo fmt
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test runtime::persistence::tests:: -- --nocapture
          cargo build
          cd ..
      - name: Commit codec implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime/persistence.rs docs/DEVELOPMENT.md CHANGELOG.md
          git commit -m "Add opaque persistence image codec"
          git push origin HEAD:opaque-persistence-codec
