name: Runtime host persistence experiment

on:
  push:
    branches:
      - runtime-host-persistence-experiment

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-host-persistence-experiment
      - run: python .github/scripts/add_host_persistence_experiment.py
      - name: Format and run host persistence tests
        run: |
          cd compiler
          cargo fmt
          cargo test runtime::restart_checkpoint_experiment::empty_provider_opens -- --nocapture
          cargo test runtime::restart_checkpoint_experiment::provider_load_reconstructs -- --nocapture
          cargo test runtime::restart_checkpoint_experiment::provider_replace_failure -- --nocapture
          cargo test runtime::restart_checkpoint_experiment::semantic_failure_does_not_call_provider_replace -- --nocapture
          cargo test runtime::restart_checkpoint_experiment::durable_ -- --nocapture
          cargo test runtime::restart_checkpoint_experiment::checkpoint_ -- --nocapture
          cd ..
      - name: Commit runtime-only experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime/restart_checkpoint_experiment.rs
          git commit -m "Prove runtime host persistence boundary"
          git push origin HEAD:runtime-host-persistence-experiment
