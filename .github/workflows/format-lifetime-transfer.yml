name: Format lifetime transfer surface

on:
  push:
    branches:
      - leaf-provenance-transfer-surface

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leaf-provenance-transfer-surface
      - name: Format Rust source
        run: |
          cd compiler
          cargo fmt
          cd ..
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/lifetime_transfer_surface.rs
          git commit -m "Format lifetime transfer surface"
          git push origin HEAD:leaf-provenance-transfer-surface
