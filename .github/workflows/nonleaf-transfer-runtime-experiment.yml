name: Non-leaf transfer runtime experiment

on:
  push:
    branches:
      - nonleaf-transfer-runtime-experiment

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonleaf-transfer-runtime-experiment
      - name: Apply runtime-only experiment
        run: python .github/scripts/apply_nonleaf_transfer_experiment.py
      - name: Format and run focused transfer tests
        run: |
          cd compiler
          cargo fmt
          cargo test runtime::provenance_transfer_execution -- --nocapture
          cd ..
      - name: Commit runtime experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime.rs compiler/src/runtime/provenance_transfer_execution.rs
          git commit -m "Pressure-test acyclic non-leaf provenance transfer"
          git push origin HEAD:nonleaf-transfer-runtime-experiment
