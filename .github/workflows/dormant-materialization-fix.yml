name: Dormant materialization fix

on:
  push:
    branches:
      - dormant-identity-materialization-experiment

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dormant-identity-materialization-experiment
      - name: Remove invalid ordinary designation read assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('compiler/src/runtime/persistence/partial_materialization_experiment.rs')
          text = path.read_text()
          block = '''    assert_eq!(\n        partial.runtime.value("coldFolder").unwrap(),\n        Value::String(cold_folder.clone())\n    );\n'''
          if text.count(block) != 1:
              raise SystemExit(f'expected assertion block once, found {text.count(block)}')
          path.write_text(text.replace(block, '', 1))
          PY
          cd compiler
          cargo fmt
          cd ..
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime/persistence/partial_materialization_experiment.rs
          git commit -m "Fix dormant designation assertion"
          git push origin HEAD:dormant-identity-materialization-experiment
