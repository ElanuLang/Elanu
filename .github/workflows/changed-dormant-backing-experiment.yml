name: Changed dormant backing experiment

on:
  push:
    branches:
      - changed-dormant-backing-experiment

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: changed-dormant-backing-experiment
      - name: Wire experiment
        run: python .github/scripts/wire_changed_dormant_backing_experiment.py
      - name: Validate experiment
        working-directory: compiler
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test changed_dormant_backing_experiment
          cargo build
      - name: Commit experiment changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime/persistence.rs compiler/src/runtime/persistence/changed_dormant_backing_experiment.rs
          if ! git diff --cached --quiet; then
            git commit -m "Wire changed dormant backing experiment"
            git push origin HEAD:changed-dormant-backing-experiment
          fi
