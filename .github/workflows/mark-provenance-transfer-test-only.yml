name: Mark provenance transfer test-only

on:
  push:
    branches:
      - runtime-leaf-provenance-transfer

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-leaf-provenance-transfer
      - name: Apply test-only boundary
        run: python .github/scripts/mark_provenance_transfer_test_only.py
      - name: Format and commit
        run: |
          cd compiler
          cargo fmt
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime.rs
          git commit -m "Keep provenance transfer runtime entry test-only"
          git push origin HEAD:runtime-leaf-provenance-transfer
