name: Dormant materialization format

on:
  push:
    branches:
      - dormant-identity-materialization-experiment

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dormant-identity-materialization-experiment
      - name: Apply rustfmt
        run: |
          cd compiler
          cargo fmt
          cd ..
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/runtime/persistence/partial_materialization_experiment.rs
          git commit -m "Format dormant materialization experiment"
          git push origin HEAD:dormant-identity-materialization-experiment
